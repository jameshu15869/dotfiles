[ids]

*

[global]
chord_timeout = 40

[main]

leftshift+leftmeta+f23 = leftmeta
capslock = overload(control, esc)
enter = overload(control, enter)
space = overloadt(nav, space, 250)

# homerow mods, we have to use combos since keyd doesn't support all the fancy features
# f+d = leftshift
# s+d = leftcontrol
# a+s = leftmeta
# a+f = leftalt
# j+k = rightshift
# k+l = rightcontrol
# l+; = rightmeta

a = overloadi(a, overloadt2(meta, a, 200), 125)
s = overloadi(s, overloadt2(alt, s, 200), 125)
d = overloadi(d, overloadt2(control, d, 200), 125)
f = overloadi(f, overloadt2(shift, f, 200), 125)
j = overloadi(j, overloadt2(shift, j, 200), 125)
k = overloadi(k, overloadt2(control, k, 200), 125)
l = overloadi(l, overloadt2(alt, l, 200), 125)
semicolon = overloadi(semicolon, overloadt2(meta, semicolon, 200), 125)

# rightalt is weird on linux
# j+; = rightalt
j+; = leftalt
[ = backspace

leftalt = overloadt(symbols, leftalt, 250)
rightalt = overloadt(intellij, leftalt, 250)

[nav]
h = left
j = down
k = up
l = right
u = home
o = end
i = pageup
p = pagedown
n = macro(C-{)
m = macro(C-})
a = macro(leftmeta+1)
s = macro(leftmeta+2)
d = macro(leftmeta+3)
f = macro(leftmeta+4)
capslock = capslock

[symbols]
# lets alt+numbers still work for firefox
1 = macro(A-1)
2 = macro(A-2)
3 = macro(A-3)
4 = macro(A-4)
5 = macro(A-5)
6 = macro(A-6)
7 = macro(A-7)
8 = macro(A-8)
9 = macro(A-9)
0 = macro(A-0)

q = !
w = @
e = macro(S-3)
r = $
t = %
y = ^
u = &
i = (
o = )
p = *
h = -
j = =
k = [
l = ]
; = \
n = _
m = +
, = {
. = }
/ = |

[intellij]
# debugging, matches layout in GUI window
tab = f9
q = f8
w = f7
e = macro(S-f8)

# general chords
r = macro(S-f10)
d = macro(S-f9)
t = macro(A-f12)
f = macro(C-S-f12)
g = macro(C-S-`)

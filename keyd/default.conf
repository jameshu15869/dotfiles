[ids]

*

[main]

leftshift+leftmeta+f23 = leftmeta
# leftshift+leftmeta+f23 = layer(leftmodifiers)
capslock = overload(control, esc)
tab = overload(vimmer, tab)
enter = overload(leftmodifiers, enter)
space = overloadt(nav, space, 150)
' = rightshift
rightshift = '

[ = backspace

[vimmer]
h = left
j = down
k = up
l = right
u = home
o = end
i = pageup
p = pagedown
n = macro(A-left)
m = macro(A-right)

# intellij run
7 = macro(S-f10)
# intellij debug
8 = macro(S-f9)
# intellij hide all panels
comma = macro(C-S-f12)

[nav]
# kde workspace switching
a = macro(leftmeta+1)
s = macro(leftmeta+2)
d = macro(leftmeta+3)
f = macro(leftmeta+4)

# with this exception because we need a strong finger to activate the secondary layer
e = layer(vimmer)
t = oneshot(firefox)

j = oneshot(control)
k = oneshot(alt)
l = oneshot(meta)
semicolon = oneshot(shift)

n = macro(C-pageup)
m = macro(C-pagedown)

o = macro(A-o)

# these are originally shadowed by the backspace/shift moves in main, restore them in this layer
apostrophe = apostrophe
[ = [
capslock = capslock

[firefox]
q = macro(A-1)
w = macro(A-2)
e = macro(A-3)
r = macro(A-4)
t = macro(A-5)

[leftmodifiers]

# yakuake
t = f12

# firefox tab search
r = macro(C-S-f)

a = oneshot(shift)
s = oneshot(meta)
f = oneshot(control)

# NOTICE: alt isn't used as frequently as ctrl so we substitute it
# to make activating the vimmer layer easier
d = layer(vimmer)

g = oneshot(alt)

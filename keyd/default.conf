[ids]

*

[global]
chord_timeout = 40

[main]

leftshift+leftmeta+f23 = leftmeta
capslock = overload(control, esc)
enter = overload(control, enter)
space = overloadt(nav, space, 250)

# homerow mods, we have to use combos since keyd doesn't support all the fancy features
# f+d = leftshift
# s+d = leftcontrol
# a+s = leftmeta
# a+f = leftalt
# j+k = rightshift
# k+l = rightcontrol
# l+; = rightmeta

# Conventional home row mods
# a = overloadi(a, overloadt2(meta, a, 200), 175)
# s = overloadi(s, overloadt2(alt, s, 200), 175)
# d = overloadi(d, overloadt2(control, d, 200), 175)
# f = overloadi(f, overloadt2(shift, f, 200), 125)
# j = overloadi(j, overloadt2(shift, j, 200), 125)
# k = overloadi(k, overloadt2(control, k, 200), 175)
# l = overloadi(l, overloadt2(alt, l, 200), 175)
# semicolon = overloadi(semicolon, overloadt2(meta, semicolon, 200), 175)

# bottom row mods
# z = overloadi(z, overloadt2(meta, z, 200), 125)
# x = overloadi(x, overloadt2(alt, x, 200), 125)
# c = overloadi(c, overloadt2(control, c, 200), 125)
# v = overloadi(v, overloadt2(shift, v, 200), 75)
# m = overloadi(m, overloadt2(shift, m, 200), 75)
# comma = overloadi(comma, overloadt2(control, comma, 200), 125)
# . = overloadi(., overloadt2(alt, ., 200), 125)
# / = overloadi(/, overloadt2(meta, /, 200), 125)

# Home row mods except shift?
# s = overloadi(s, overloadt2(meta, s, 200), 150)
# d = overloadi(d, overloadt2(alt, d, 200), 150)
# f = overloadi(f, overloadt2(control, f, 200), 150)
# j = overloadi(j, overloadt2(control, j, 200), 150)
# k = overloadi(k, overloadt2(alt, k, 200), 150)
# l = overloadi(l, overloadt2(meta, l, 200), 150)
# / = overloadi(/, overloadt2(shift, /, 200), 150)

# left shift is easily reachable by left pinky
# binding right shift to a rarely used key fixes the misfire problem
' = rightshift

[ = backspace
- = delete

leftalt = layer(symbols)
rightalt = layer(intellij)

[nav]
h = left
j = down
k = up
l = right
u = home
o = end
i = pageup
p = pagedown
v = macro(C-{)
b = macro(C-})
# kde workspace switching
a = macro(leftmeta+1)
s = macro(leftmeta+2)
d = macro(leftmeta+3)
f = macro(leftmeta+4)
# firefox tab switching
q = macro(A-1)
w = macro(A-2)
e = macro(A-3)
r = macro(A-4)
t = macro(A-5)
n = macro(C-S-tab)
m = macro(C-tab)
capslock = capslock

[symbols]
# lets alt+numbers still work for firefox
1 = macro(A-1)
2 = macro(A-2)
3 = macro(A-3)
4 = macro(A-4)
5 = macro(A-5)
6 = macro(A-6)
7 = macro(A-7)
8 = macro(A-8)
9 = macro(A-9)
0 = macro(A-0)

q = !
w = @
e = macro(S-3)
r = $
t = %
y = ^
u = &
i = (
o = )
p = *
h = -
j = =
k = [
l = ]
n = _
m = +
, = {
. = }
7 = \
8 = |
shift+' = "
' = '


[intellij]
# debugging, matches layout in GUI window
tab = f9
q = f8
w = f7
e = macro(S-f8)

# general chords
r = macro(S-f10)
d = macro(S-f9)
t = macro(A-f12)
a = macro(C-S-f12)
v = macro(C-S-`)

# callum chords
s = oneshot(meta)
d = oneshot(alt)
f = oneshot(control)

j = oneshot(control)
k = oneshot(alt)
l = oneshot(meta)
